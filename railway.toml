[build]
builder = "nixpacks"

[deploy]
preDeployCommand = "php artisan migrate:fresh --force && php artisan db:seed --class=AdminSeeder --force"
startCommand = "php artisan serve --host=0.0.0.0 --port=$PORT"
healthcheckPath = "/api/health"
healthcheckTimeout = 100
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 10

[deploy.variables]
PHP_VERSION = "8.2"
APP_ENV = "production"
APP_DEBUG = "false"